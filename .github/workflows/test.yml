name: Test

on:
  push:
    branches:
      - master
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "README*.md"
      - "p2d/**"
      - "test/**"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "README*.md"
      - "p2d/**"
      - "test/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Check formatting, lint, types, and file hygiene
        run: uv run --locked pre-commit run --all-files

      - name: Build distributions
        run: uv build

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Register pytest problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/problem-matchers/pytest.json"

      - name: Run tests
        run: uv run --locked pytest
