# Select with --config; a local config.toml takes precedence.

language_preference = ["english", "russian", "chinese"]

# Standard checker arguments used by --auto.
[flag]
"fcmp.cpp" = "case_sensitive space_change_sensitive"
"lcmp.cpp" = "case_sensitive"
"rcmp4.cpp" = "float_tolerance 1e-4"
"rcmp6.cpp" = "float_tolerance 1e-6"
"rcmp9.cpp" = "float_tolerance 1e-9"
"wcmp.cpp" = "case_sensitive"

# permitted: allowed results per test; required: any listed result must occur.
# Omitted fields default to ["AC", "WA", "TLE", "RTE"].
# A custom tag table replaces this entire mapping.
[tag]
main = { permitted = ["AC"] }
accepted = { permitted = ["AC"] }
wrong-answer = { permitted = ["AC", "WA"], required = ["WA"] }
presentation-error = { permitted = ["AC", "WA"], required = ["WA"] }
time-limit-exceeded = { permitted = ["AC", "TLE"], required = ["TLE"] }
time-limit-exceeded-or-accepted = { permitted = ["AC", "TLE"] }
time-limit-exceeded-or-memory-limit-exceeded = { permitted = ["AC", "RTE", "TLE"], required = ["RTE", "TLE"] }
memory-limit-exceeded = { permitted = ["AC", "RTE"], required = ["RTE"] }
rejected = { required = ["RTE", "TLE", "WA"] }
failed = { required = ["RTE", "TLE", "WA"] }

[example_path_pattern]
input = "example.%02d"
output = "example.%02d.a"

# Comment syntax for legacy @EXPECTED_RESULTS@ annotations.
[comment_str]
c = "//"
cpp = "//"
java = "//"
python = "#"
kotlin = "//"
