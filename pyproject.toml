[build-system]
requires = ["hatchling>=1.33.0,<2.0.0", "hatch-vcs>=0.5.0,<0.6.0"]
build-backend = "hatchling.build"

[project]
name = "p2d"
description = "Simple python script converting polygon package to domjudge(kattis) package"
authors = [{ name = "cubercsl", email = "hi@cubercsl.site" }]
maintainers = [
    { name = "cubercsl", email = "hi@cubercsl.site" },
    { name = "Dup4", email = "hi@dup4.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["Polygon", "DOMjudge", "Kattis", "Codeforces"]
classifiers = [
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.12"
dependencies = [
    "deepmerge>=4.0.0,<5.0.0",
    "pydantic>=2.14.2,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rich>=15.0.0,<16.0.0",
    "typer>=0.27.3,<0.28.0",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/cn-xcpc-tools/Polygon2Domjudge"
documentation = "https://github.com/cn-xcpc-tools/Polygon2Domjudge"
repository = "https://github.com/cn-xcpc-tools/Polygon2Domjudge"

[project.scripts]
p2d = "p2d.cli:app"
p2d-contest = "p2d.contest:app"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0,<5.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.3,<0.18.0",
    "ty>=0.0.97,<0.1.0",
    "types-pyyaml>=6.0.12.20261103,<7.0.0.0",
]

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["p2d", "test"]

[tool.ty.rules]
missing-type-argument = "error"

[tool.pytest.ini_options]
addopts = [
    "--cov=p2d",
    "--cov-report",
    "term-missing",
    "--cov-report",
    "xml",
    "--cov-fail-under=80",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
    "raise ProcessError",
]

[tool.hatch.build.hooks.vcs]
version-file = "p2d/_version.py"

[tool.hatch.build.targets.wheel]
exclude = ["p2d/testlib/**/*", "!p2d/testlib/testlib.h", "!p2d/testlib/LICENSE"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--first-parent",
]
